name: Publish GitHub Pages preview

on:
  push:
    branches:
      - "arena/01a10b12-deshik-consulting"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check GitHub Pages setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GITHUB_TOKEN}" --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" != "200" ]; then
            echo "::error title=GitHub Pages setup required::Open repository Settings → Pages and set Build and deployment Source to GitHub Actions, then rerun this workflow."
            printf '### One-time GitHub Pages setup required\n\nA repository admin must open [Settings → Pages](https://github.com/%s/settings/pages) and set **Build and deployment → Source** to **GitHub Actions**. Then rerun this workflow to publish the preview.\n' "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp -- *.html _site/
          cp -- .nojekyll _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site preview
        id: deployment
        uses: actions/deploy-pages@v4
